<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>The Toolkit Index — CTF Reference</title>
<style>
  :root{
    --paper: #f6f3ea;
    --paper-2: #efeadb;
    --ink: #1f1b16;
    --ink-soft: #5c564a;
    --rule: #cdc4ac;
    --red: #a13d2b;
    --red-soft: #c2694f;
    --tab-bg: #e7e0cb;
    --serif: 'Iowan Old Style', Georgia, 'Times New Roman', serif;
    --mono: 'Courier New', ui-monospace, monospace;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    background-image:
      linear-gradient(var(--paper) 0%, var(--paper) 100%);
    color:var(--ink);
    font-family:var(--serif);
    line-height:1.5;
    min-height:100vh;
  }

  .frame{
    display:grid;
    grid-template-columns: 230px 1fr;
    min-height:100vh;
    max-width:1180px;
    margin:0 auto;
    border-left:1px solid var(--rule);
    border-right:1px solid var(--rule);
  }

  /* ---- Sidebar: card-catalog drawer labels ---- */
  aside{
    background:var(--paper-2);
    border-right:1px solid var(--rule);
    padding:28px 0 40px;
    position:sticky;
    top:0;
    align-self:start;
    height:100vh;
    overflow-y:auto;
  }
  .brand{
    padding:0 20px 20px;
    border-bottom:1px solid var(--rule);
    margin-bottom:6px;
  }
  .brand .stamp{
    display:inline-block;
    font-family:var(--mono);
    font-size:10.5px;
    letter-spacing:0.06em;
    color:var(--red);
    border:1px solid var(--red-soft);
    padding:2px 6px;
    margin-bottom:10px;
    transform:rotate(-1.2deg);
  }
  .brand h1{
    font-size:20px;
    margin:0 0 4px;
    font-weight:600;
  }
  .brand p{
    font-size:12.5px;
    color:var(--ink-soft);
    margin:0;
  }

  nav.drawers{padding-top:6px;}
  .drawer{
    display:block;
    width:100%;
    text-align:left;
    background:none;
    border:none;
    border-bottom:1px solid var(--rule);
    padding:11px 20px;
    font-family:var(--serif);
    font-size:14px;
    color:var(--ink);
    cursor:pointer;
  }
  .drawer .count{
    font-family:var(--mono);
    font-size:11px;
    color:var(--ink-soft);
    float:right;
  }
  .drawer:hover{background:var(--tab-bg);}
  .drawer.active{
    background:var(--ink);
    color:var(--paper);
    font-weight:600;
  }
  .drawer.active .count{color:var(--paper-2);}

  /* ---- Main area ---- */
  main{padding:34px 40px 80px;}

  .search-row{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    gap:20px;
    border-bottom:2px solid var(--ink);
    padding-bottom:10px;
    margin-bottom:26px;
    flex-wrap:wrap;
  }
  .search-row h2{
    font-size:22px;
    margin:0;
  }
  .search-row .role{
    font-size:13px;
    color:var(--ink-soft);
    font-style:italic;
  }
  #search{
    font-family:var(--mono);
    font-size:13px;
    background:transparent;
    border:none;
    border-bottom:1px solid var(--rule);
    color:var(--ink);
    padding:6px 2px;
    min-width:220px;
    outline:none;
  }
  #search:focus{border-color:var(--red);}
  #search::placeholder{color:var(--ink-soft);}

  /* ---- Index cards ---- */
  .cardlist{display:flex;flex-direction:column;}
  .index-card{
    display:grid;
    grid-template-columns: 30px 1fr auto;
    gap:16px;
    align-items:start;
    padding:16px 4px;
    border-bottom:1px dashed var(--rule);
  }
  .index-card .num{
    font-family:var(--mono);
    font-size:11px;
    color:var(--ink-soft);
    padding-top:3px;
  }
  .index-card h3{
    font-size:16px;
    margin:0 0 4px;
    display:inline;
  }
  .index-card .cat-tag{
    font-family:var(--mono);
    font-size:10px;
    text-transform:uppercase;
    letter-spacing:0.04em;
    color:var(--red);
    border:1px solid var(--red-soft);
    padding:1px 5px;
    margin-left:8px;
    vertical-align:middle;
  }
  .index-card p{
    font-size:13.5px;
    color:var(--ink-soft);
    margin:4px 0 0;
    max-width:62ch;
  }
  .index-card a.go{
    font-family:var(--mono);
    font-size:12px;
    color:var(--ink);
    text-decoration:none;
    border-bottom:1px solid var(--ink);
    white-space:nowrap;
    padding-top:4px;
  }
  .index-card a.go:hover{color:var(--red);border-color:var(--red);}

  .empty{
    font-family:var(--mono);
    font-size:13px;
    color:var(--ink-soft);
    padding:30px 4px;
  }

  footer{
    margin-top:40px;
    padding-top:14px;
    border-top:1px solid var(--rule);
    font-family:var(--mono);
    font-size:11px;
    color:var(--ink-soft);
  }

  @media (max-width: 760px){
    .frame{grid-template-columns:1fr;}
    aside{position:static;height:auto;border-right:none;border-bottom:1px solid var(--rule);}
    nav.drawers{display:flex;flex-wrap:wrap;}
    .drawer{width:auto;border-bottom:none;border:1px solid var(--rule);margin:4px;}
    .index-card{grid-template-columns: 24px 1fr;}
    .index-card a.go{grid-column:1 / -1;}
  }
</style>
</head>
<body>
<div class="frame">

  <aside>
    <div class="brand">
      <span class="stamp">ref. no. 001</span>
      <h1>The Toolkit Index</h1>
      <p>A card catalog of CTF tools, sorted by category, with a line to the source.</p>
    </div>

  <main>
    <div class="search-row">

      </div>
      <input id="search" type="text" placeholder="search the catalog…">
    </div>

    <div class="cardlist" id="cardlist"></div>

    <footer>compiled from public documentation · every link goes to the tool's official page or repository · for lawful, authorized CTF and lab use</footer>
  </main>

</div>

      {n:"Damn Vulnerable Web App (DVWA)", d:"PHP/MySQL app with adjustable difficulty levels across classic web vulnerability classes.", u:"https://github.com/digininja/DVWA"},
      {n:"PicoCTF", d:"Beginner-friendly, always-available CTF platform run by Carnegie Mellon, great for first-timers.", u:"https://picoctf.org/"},
      {n:"HackTheBox", d:"Subscription/free-tier platform with CTF challenges and full vulnerable machines to practice on.", u:"https://www.hackthebox.com/"},
      {n:"TryHackMe", d:"Guided, beginner-friendly rooms covering every CTF category with structured learning paths.", u:"https://tryhackme.com/"},
      {n:"pwnable.kr / pwnable.tw", d:"Long-running binary exploitation wargames ranging from beginner to advanced pwn challenges.", u:"https://pwnable.kr/"},
      {n:"CryptoHack", d:"Gamified platform purely for learning and practicing cryptography attacks.", u:"https://cryptohack.org/"}
    ]
  },
  {
    key: "learn", title: "Learning & references", role: "background reading, cheat sheets, and writeups",
    tools: [
      {n:"CTFtime", d:"Team ratings, event calendar, and archived writeup links for past competitions.", u:"https://ctftime.org/"},
      {n:"awesome-ctf", d:"Community-curated master list of CTF frameworks, tools, and resources on GitHub.", u:"https://github.com/apsdehal/awesome-ctf"},
      {n:"GTFOBins", d:"Reference of Unix binaries that can be abused to bypass restricted shells during privilege escalation.", u:"https://gtfobins.github.io/"},
      {n:"HackTricks", d:"Extensive wiki of pentesting and CTF techniques organized by attack surface and technology.", u:"https://book.hacktricks.xyz/"},
      {n:"PayloadsAllTheThings", d:"Enormous reference collection of payloads and bypass techniques across almost every vulnerability class.", u:"https://github.com/swisskyrepo/PayloadsAllTheThings"}
    ]
  }
];
const drawersEl = document.getElementById('drawers');
const cardlistEl = document.getElementById('cardlist');
const titleEl = document.getElementById('section-title');
const roleEl = document.getElementById('section-role');
const searchEl = document.getElementById('search');

let activeFilter = "all";

function buildDrawers(){
  const totalCount = DATA.reduce((sum,c)=>sum+c.tools.length,0);
  const allBtn = document.createElement('button');
  allBtn.className = 'drawer active';
  allBtn.dataset.filter = 'all';
  allBtn.innerHTML = `All entries <span class="count">${totalCount}</span>`;
  drawersEl.appendChild(allBtn);

  DATA.forEach(cat=>{
    const btn = document.createElement('button');
    btn.className = 'drawer';
    btn.dataset.filter = cat.key;
    btn.innerHTML = `${cat.title} <span class="count">${cat.tools.length}</span>`;
    drawersEl.appendChild(btn);
  });

  drawersEl.querySelectorAll('.drawer').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      drawersEl.querySelectorAll('.drawer').forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
      activeFilter = btn.dataset.filter;
      render();
    });
  });
}

function render(){
  const query = searchEl.value.trim().toLowerCase();
  cardlistEl.innerHTML = "";

  let cats = DATA;
  if(activeFilter !== "all"){
    cats = DATA.filter(c=>c.key === activeFilter);
    titleEl.textContent = cats[0].title;
    roleEl.textContent = cats[0].role;
  } else {
    titleEl.textContent = "All entries";
    roleEl.textContent = "every tool in the index";
  }

  let entryNum = 1;
  let shown = 0;

  cats.forEach(cat=>{
    cat.tools.forEach(t=>{
      const hay = (t.n + " " + t.d + " " + cat.title).toLowerCase();
      if(query && !hay.includes(query)) return;
      shown++;
      const row = document.createElement('div');
      row.className = 'index-card';
      row.innerHTML = `
        <div class="num">${String(entryNum).padStart(3,'0')}</div>
        <div>
          <h3>${t.n}</h3>${activeFilter === 'all' ? `<span class="cat-tag">${cat.title}</span>` : ''}
          <p>${t.d}</p>
        </div>
        <a class="go" href="${t.u}" target="_blank" rel="noopener">visit site →</a>
      `;
      cardlistEl.appendChild(row);
      entryNum++;
    });
  });

  if(shown === 0){
    cardlistEl.innerHTML = `<div class="empty">No entries match "${query}" in this drawer.</div>`;
  }
}

searchEl.addEventListener('input', render);

buildDrawers();
render();
</script>
</body>
</html>
